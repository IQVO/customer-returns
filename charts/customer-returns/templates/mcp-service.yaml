{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "customer-returns.mcpFullname" . }}
  labels:
    {{- include "customer-returns.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.mcp.service.type }}
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: {{ ternary "mcp" "http" (eq (include "customer-returns.agentsColocated" .) "true") }}
      protocol: TCP
      name: http
  selector:
    {{- include "customer-returns.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ ternary "agents" "mcp" (eq (include "customer-returns.agentsColocated" .) "true") }}
{{- end }}
